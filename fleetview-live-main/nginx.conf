# Serves the built Vite SPA. API/WebSocket calls go straight from the browser
# to the backend URL baked in at build time (VITE_API_URL / VITE_WS_URL), so
# no proxying is needed here.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every route resolves to index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
