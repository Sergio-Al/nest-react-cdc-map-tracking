# Build the four app images on GitHub runners, push to GHCR, then SSH into
# the EC2 host and swap the running containers. Infra containers (Kafka, DBs,
# Traccar, OSRM) are untouched by deploys — only app images change.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   EC2_HOST     — the Elastic IP
#   EC2_SSH_KEY  — contents of ~/.ssh/tracking-demo-key.pem
# Required repository variables:
#   DEPLOY_ENABLED — set to "true" to run the deploy job. Unset = build/push
#                    images only (the EC2 demo host was torn down 2026-09-26).
#   VITE_API_URL — e.g. http://<elastic-ip>:3000  (baked into the frontend bundle)
#   VITE_WS_URL  — e.g. http://<elastic-ip>:3000
#
# GHCR note: images push under ghcr.io/<owner>/<repo>/<service>. The first
# push creates them private — make them public (or add a read PAT on the
# server) so the EC2 host can `docker compose pull` without auth.

name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: tracking-service
            context: ./tracking-service
            target: production
          - name: frontend
            context: ./fleetview-live-main
          - name: integration-service
            context: ./integration-service-nest
          - name: or-tools-solver
            context: ./infrastructure/or-tools-solver
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image path
        run: echo "IMAGE=${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    needs: build
    # Skipped unless the repo variable DEPLOY_ENABLED is "true" — there is no
    # host to deploy to right now. Re-enable after deploy/aws/provision.sh.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/tracking
            git fetch origin master && git reset --hard origin/master
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d --remove-orphans
            docker image prune -f
